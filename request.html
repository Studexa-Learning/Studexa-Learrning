<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Request Studexa</title><link rel="stylesheet" href="app.css"></head><body><header class="publicnav"><a href="index.html" class="logo">Studexa<span>Learning</span></a><div style="margin-left:auto"><a class="btn secondary" href="login.html">Log in</a></div></header><main class="requestwrap"><h1>Request Studexa for your school</h1><p class="muted" style="font-size:18px">Submit a school request. Studexa Manager can review it, approve access and issue a one-time school admin activation code.</p><div id="requestResult" style="margin:18px 0"></div><form id="schoolRequest" class="card"><div class="formgrid"><div class="field"><label>School name</label><input required name="school" placeholder="Westview Secondary"></div><div class="field"><label>School type</label><select name="type"><option>Secondary</option><option>All-through</option><option>Sixth form</option></select></div><div class="field"><label>School website</label><input name="website" placeholder="school.example"></div><div class="field"><label>Estimated students</label><input name="students" type="number" min="1" placeholder="850"></div><div class="field"><label>Admin name</label><input required name="admin" placeholder="Morgan Reed"></div><div class="field"><label>Admin school email</label><input required type="email" name="email" placeholder="admin@school.example"></div><div class="field"><label>Microsoft 365 Education?</label><select name="microsoft"><option value="no">No / not sure</option><option value="yes">Yes</option></select></div><div class="field"><label>Microsoft organisation domain</label><input name="domain" placeholder="school.example"></div></div><div style="margin:18px 0"><strong>Products requested</strong><div class="pillselect" style="margin-top:8px"><label><input type="checkbox" name="product" value="Maths" checked>Studexa Maths</label><label><input type="checkbox" name="product" value="Science" checked>Studexa Science</label></div></div><button class="btn primary" type="submit">Submit school request →</button></form></main><script src="app.js"></script></body></html>
